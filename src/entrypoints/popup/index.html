<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>solved.tags</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="brand">
    <img src="/icon48.png" width="32" height="32" alt="">
    <h1>solved<span>.tags</span></h1>
  </header>

  <main>
    <section class="settings" aria-label="확장 설정">
      <label class="setting" for="enable-toggle">
        <span>기여 페이지에 필터 표시</span>
        <input type="checkbox" role="switch" id="enable-toggle" aria-describedby="usage" disabled>
      </label>
      <p id="usage">solved.ac에 로그인한 뒤 프로필의 기여 탭에서 <strong>메타 태그 불러오기</strong>를 누르세요.</p>
      <p id="storage-error" role="alert" hidden></p>
    </section>

    <section aria-labelledby="tags-title">
      <h2 id="tags-title">지원하는 메타 태그</h2>
      <ul class="tag-list" id="tags"></ul>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
